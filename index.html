<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Automation Studio | Final Edition</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  body { background: #f8fafc; font-family: 'Inter', sans-serif; padding: 40px 15px; }
  .studio-card { max-width: 950px; margin: auto; background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
  .terminal-box { background: #0f172a; color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; padding: 20px; border-radius: 8px; width: 100%; height: 300px; overflow-y: auto; white-space: pre; }
</style>
</head>
<body>

<div class="studio-card">
  <div class="p-4 border-bottom">
    <h3 class="m-0 fw-bold">ERP Live Class Scheduler</h3>
  </div>
  
  <div class="p-4">
    <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#fileTab">File Import</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pasteTab">Paste Data</button></li>
    </ul>

    <div class="tab-content" id="myTabContent">
      <div class="tab-pane fade show active" id="fileTab">
        <label class="form-label fw-semibold">Upload Schedule (.xlsx)</label>
        <input type="file" id="excelFile" class="form-control mb-3" accept=".xlsx, .xls">
        <small class="text-muted">Expected columns: Start Date, End Date, Start Time, End Time, Days, Class, Section, Teacher, Subject</small>
      </div>
      <div class="tab-pane fade" id="pasteTab">
        <label class="form-label fw-semibold">Paste Excel Rows</label>
        <textarea id="manualData" class="form-control mb-3" rows="3" placeholder="Paste data: Start Date | End Date | Start Time | End Time | Days | Class | Section | Teacher | Subject"></textarea>
      </div>
    </div>

    <button id="compileBtn" class="btn btn-primary w-100 p-3 fw-bold mt-3" onclick="generateScript()">Compile Userscript</button>

    <div class="mt-4">
      <textarea id="scriptOutput" class="terminal-box" readonly></textarea>
      <button class="btn btn-outline-secondary w-100 mt-2" onclick="copy()"><i class="bi bi-clipboard me-2"></i>Copy Script</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let parsedClassData = [];

document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet);
            processData(jsonData);
        } catch (err) { alert("Reading Error: " + err.message); }
    };
    reader.readAsArrayBuffer(file);
});

function processData(data) {
    parsedClassData = data.map(row => {
        const get = (key) => row[key] || row[Object.keys(row).find(k => k.toLowerCase().includes(key.toLowerCase()))] || "";
        const start = parseTime(get('Start Time'));
        const end = parseTime(get('End Time'));
        
        let rawClass = get('Class');
        let rawSection = get('Section').toString().trim();
        let finalSection = rawSection;
        
        // Ensure "All Section" or comma separated items aren't forced into standard "Class-Section" logic
        if (rawSection.toUpperCase() !== 'ALL SECTION' && rawSection.toUpperCase() !== 'SELECT ALL' && !rawSection.includes(',')) {
            if (rawClass && !rawSection.toUpperCase().startsWith(rawClass.toString().toUpperCase())) {
                finalSection = `${rawClass}-${rawSection}`;
            }
        }

        // Process Custom Days (Fallback to Mon-Sat if empty)
        let rawDays = get('Days');
        let daysArray = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        if (rawDays) {
            daysArray = rawDays.toString().split(',').map(d => d.trim()).filter(d => d);
        }
        
        return {
            "Date": formatDate(get('Start Date')),
            "EndDate": formatDate(get('End Date')),
            "Days": daysArray,
            "StartTime": start.Hour, "StartMin": start.Min, "StartAMPM": start.AMPM,
            "EndTime": end.Hour, "EndMin": end.Min, "EndAMPM": end.AMPM,
            "Class": rawClass,
            "Section": finalSection,
            "Teacher": get('Teacher'),
            "Subject": get('Subject')
        };
    });
    alert("Data parsed successfully! " + parsedClassData.length + " rows.");
}

function formatDate(dateStr) {
    if (!dateStr) return "";
    if (typeof dateStr === 'number') {
        const d = new Date((dateStr - (25567 + 2))*86400*1000);
        return d.toISOString().split('T')[0];
    }
    if (dateStr.includes('-')) {
        const parts = dateStr.split('-');
        if (parts[0].length === 2) return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return dateStr;
}

function parseTime(timeStr) {
    if(!timeStr) return { Hour: '12', Min: '00', AMPM: 'AM' };
    let cleanStr = timeStr.toString().trim();
    
    // First, try to match formats that explicitly include AM or PM (e.g., "08:00 AM")
    let m = cleanStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (m) {
        return { Hour: m[1].padStart(2, '0'), Min: m[2], AMPM: m[3].toUpperCase() };
    }
    
    // Next, try to match 24-hour formats without AM/PM (e.g., "08:00", "14:35")
    m = cleanStr.match(/(\d{1,2}):(\d{2})/);
    if (m) {
        let h = parseInt(m[1], 10);
        let min = m[2];
        let ampm = h >= 12 ? 'PM' : 'AM';
        
        // Convert to 12-hour format
        if (h > 12) h -= 12;
        if (h === 0) h = 12;
        
        return { Hour: h.toString().padStart(2, '0'), Min: min, AMPM: ampm };
    }
    
    // Default fallback
    return { Hour: '12', Min: '00', AMPM: 'AM' };
}

function generateScript() {
    const manualRaw = document.getElementById('manualData').value.trim();
    if (manualRaw) {
        const rows = manualRaw.split('\n');
        processData(rows.map(r => {
            const c = r.split('\t');
            // Updated index mapping to accommodate 'Days' at c[4]
            return {'Start Date': c[0], 'End Date': c[1], 'Start Time': c[2], 'End Time': c[3], 'Days': c[4], 'Class': c[5], 'Section': c[6], 'Teacher': c[7], 'Subject': c[8]};
        }));
    }

    if(parsedClassData.length === 0) { alert("No data detected. Please upload an Excel file or paste data."); return; }
    
    const script = `// ==UserScript==
// @name         ERP Auto-Scheduler Final
// @match        *://*/*
// @grant        none
// ==/UserScript==

(function() {
    'use strict';

    const STORAGE_RUNNING = 'erp_scheduler_running';
    const STORAGE_INDEX = 'erp_scheduler_index';
    const STORAGE_LOGS = 'erp_scheduler_logs';

    const classData = ${JSON.stringify(parsedClassData, null, 4)};

    async function triggerEvents(element) {
        ['input', 'change', 'blur'].forEach(ev => element.dispatchEvent(new Event(ev, { bubbles: true })));
    }

    async function selectCustomDropdown(selector, itemText, isIndex = false, index = 0, exactMatch = false) {
        if (!itemText) return false;
        let dropdown = isIndex ? document.querySelectorAll('ng-multiselect-dropdown')[index] : document.querySelector(\`ng-multiselect-dropdown[name="\${selector}"]\`);
        if (!dropdown) return false;

        dropdown.querySelector('.dropdown-btn').click();
        await new Promise(r => setTimeout(r, 500));

        const upperText = itemText.toUpperCase();
        let clickedAnything = false;

        // 1. Handle "Select All" scenario
        if (upperText === "ALL SECTION" || upperText === "SELECT ALL") {
            const allElements = dropdown.querySelectorAll('li, div');
            for (let el of allElements) {
                if (el.textContent.trim().toUpperCase() === 'SELECT ALL') {
                    let input = el.querySelector('input');
                    if (input) { input.click(); } else { el.click(); }
                    clickedAnything = true;
                    break;
                }
            }
        } 
        // 2. Handle single/multiple sections OR fuzzy matching
        else {
            const targetItems = itemText.split(',').map(s => s.trim().toUpperCase());
            const listItems = dropdown.querySelectorAll('.item2 li');
            
            for (let li of listItems) {
                let liText = li.textContent.trim().toUpperCase();
                let isMatch = false;
                
                if (exactMatch) {
                    isMatch = targetItems.includes(liText);
                } else {
                    // Token-based fuzzy matching
                    isMatch = targetItems.some(target => {
                        const searchTokens = target.split(/\\s+/); 
                        return searchTokens.every(token => liText.includes(token));
                    });
                }
                
                if (isMatch) {
                    let input = li.querySelector('input');
                    if (input) { input.click(); clickedAnything = true; }
                }
            }
        }

        dropdown.querySelector('.dropdown-btn').click();
        await triggerEvents(dropdown);
        return clickedAnything;
    }

    async function selectDays(daysToSelect) {
        let dropdown = document.querySelector('ng-multiselect-dropdown[name="day"]');
        if (!dropdown) return;
        dropdown.querySelector('.dropdown-btn').click();
        await new Promise(r => setTimeout(r, 500));
        const listItems = dropdown.querySelectorAll('.item2 li');
        
        // Uncheck all first (if needed to reset state)
        for (let li of listItems) {
            let checkbox = li.querySelector('input');
            if (checkbox && checkbox.checked) checkbox.click();
        }
        
        // Check only targeted days
        for (let li of listItems) {
            let dayText = li.textContent.trim().toUpperCase();
            let isTarget = daysToSelect.some(d => d.toUpperCase() === dayText);
            
            if (isTarget) {
                let checkbox = li.querySelector('input');
                if (checkbox && !checkbox.checked) checkbox.click();
            }
        }
        dropdown.querySelector('.dropdown-btn').click();
        await triggerEvents(dropdown);
    }

    async function runAutomation(entry, index) {
        try {
            const startDate = document.querySelector('input[name="startDate"]');
            const endDate = document.querySelector('input[name="endDate"]');
            if (startDate) { startDate.value = entry.Date; await triggerEvents(startDate); }
            if (endDate) { endDate.value = entry.EndDate; await triggerEvents(endDate); }
            if (entry.Days && entry.Days.length > 0) await selectDays(entry.Days);

            const timeFields = {'slotTime': entry.StartTime, 'slotMin': entry.StartMin, 'slotType': entry.StartAMPM, 'slotEndTime': entry.EndTime, 'slotEndMin': entry.EndMin, 'slotEndType': entry.EndAMPM};
            for (const [name, val] of Object.entries(timeFields)) {
                let el = document.querySelector(\`select[name="\${name}"]\`);
                if (el) { 
                    el.value = val; 
                    await new Promise(r => setTimeout(r, 100)); 
                    await triggerEvents(el); 
                }
            }

            if (!(await selectCustomDropdown("std1", entry.Class, false, 0, true))) throw new Error("Class not found: " + entry.Class);
            if (!(await selectCustomDropdown("section", entry.Section, false, 0, true))) throw new Error("Section not found: " + entry.Section);
            if (!(await selectCustomDropdown(null, entry.Teacher, true, 2, false))) throw new Error("Teacher not found: " + entry.Teacher);

            await new Promise(r => setTimeout(r, 500));

            const subjectEl = document.querySelector('select[name="subject"]');
            if (subjectEl) { 
                subjectEl.value = entry.Subject; 
                await triggerEvents(subjectEl); 
            }

            const saveBtn = document.querySelector('button.save-btn');
            if (saveBtn) saveBtn.click();
            else throw new Error("Save button not found");
            
            await new Promise(r => setTimeout(r, 1500));
            
            const yesBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.trim() === 'Yes');
            if (yesBtn) yesBtn.click();
            else throw new Error("Confirmation 'Yes' button not found");
            
            await new Promise(r => setTimeout(r, 2000));

        } catch (error) {
            console.error(\`Row \${index} Failed:\`, error.message);
            let logs = JSON.parse(localStorage.getItem(STORAGE_LOGS) || '[]');
            entry._errorReason = error.message;
            logs.push(entry);
            localStorage.setItem(STORAGE_LOGS, JSON.stringify(logs));
        }
    }

    function showLogsUI() {
        let logs = JSON.parse(localStorage.getItem(STORAGE_LOGS) || '[]');
        if (logs.length === 0) {
            alert('Automation completed successfully with ZERO failures!');
            return;
        }

        let tsvOutput = "";
        logs.forEach(log => {
            let startT = \`\${log.StartTime}:\${log.StartMin} \${log.StartAMPM}\`;
            let endT = \`\${log.EndTime}:\${log.EndMin} \${log.EndAMPM}\`;
            let daysFormatted = log.Days.join(', ');
            tsvOutput += \`\${log.Date}\\t\${log.EndDate}\\t\${startT}\\t\${endT}\\t\${daysFormatted}\\t\${log.Class}\\t\${log.Section}\\t\${log.Teacher}\\t\${log.Subject}\\n\`;
        });

        const div = document.createElement('div');
        div.style = "position:fixed;top:10%;left:50%;transform:translateX(-50%);z-index:999999;background:white;padding:25px;border:3px solid #ef4444;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);border-radius:12px;width:90%;max-width:800px;font-family:sans-serif;";
        div.innerHTML = \`
            <h4 style="color:#ef4444; margin-top:0;">⚠️ Automation Finished with \${logs.length} Errors</h4>
            <p style="margin-bottom:10px; color:#475569;">Copy the pending entries below. You can paste this directly into the <b>Paste Data</b> tab of your Web Builder to compile a new script for these remaining items.</p>
            <textarea style="width:100%;height:250px;font-family:monospace;white-space:pre;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;" readonly>\${tsvOutput.trim()}</textarea>
            <div style="margin-top:15px; display:flex; gap:10px;">
                <button id="copy-logs-btn" style="padding:10px 20px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">Copy to Clipboard</button>
                <button id="close-logs-btn" style="padding:10px 20px;background:#ef4444;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">Close & Clear Logs</button>
            </div>
        \`;
        document.body.appendChild(div);

        document.getElementById('copy-logs-btn').onclick = (e) => {
            const txt = div.querySelector('textarea');
            txt.select();
            document.execCommand('copy');
            e.target.innerText = "Copied!";
        };

        document.getElementById('close-logs-btn').onclick = () => {
            localStorage.removeItem(STORAGE_LOGS);
            div.remove();
        };
    }

    async function checkAndResume() {
        if (localStorage.getItem(STORAGE_RUNNING) === 'true') {
            let currentIndex = parseInt(localStorage.getItem(STORAGE_INDEX) || '0');
            
            if (currentIndex === 0) { localStorage.removeItem(STORAGE_LOGS); }

            if (currentIndex < classData.length) {
                console.log(\`Running automation for index \${currentIndex}\`);
                await new Promise(r => setTimeout(r, 2000));
                await runAutomation(classData[currentIndex], currentIndex);

                let nextIndex = currentIndex + 1;
                if (nextIndex < classData.length) {
                    localStorage.setItem(STORAGE_INDEX, nextIndex);
                    location.reload(); 
                } else {
                    localStorage.removeItem(STORAGE_RUNNING);
                    localStorage.removeItem(STORAGE_INDEX);
                    showLogsUI();
                }
            } else {
                localStorage.removeItem(STORAGE_RUNNING);
                localStorage.removeItem(STORAGE_INDEX);
            }
        }
    }

    function createUI() {
        if (document.getElementById('erp-scheduler-control')) return;
        const container = document.createElement('div');
        container.id = 'erp-scheduler-control';
        container.style = 'position:fixed; bottom:20px; right:20px; z-index:999999; background:white; border:2px solid #2563eb; padding:15px; width:320px; border-radius:12px; box-shadow:0 10px 15px rgba(0,0,0,0.1); font-family:sans-serif;';

        const isRunning = localStorage.getItem(STORAGE_RUNNING) === 'true';
        container.innerHTML = \`
            <h6 class="mb-2">Scheduler Automation</h6>
            <select id="start-index" class="form-select mb-2" \${isRunning ? 'disabled' : ''}></select>
            <button id="run-btn" class="btn \${isRunning ? 'btn-danger' : 'btn-primary'} w-100">\${isRunning ? 'STOP / RESET' : 'RUN AUTOMATION'}</button>
        \`;

        const select = container.querySelector('#start-index');
        classData.forEach((item, i) => { 
            const opt = document.createElement('option'); 
            opt.value = i; 
            opt.text = \`[\${i}] \${item.Class || ''} \${item.Section || ''} - \${item.Teacher || ''}\`; 
            select.appendChild(opt); 
        });

        if (isRunning) { select.value = localStorage.getItem(STORAGE_INDEX) || '0'; }

        container.querySelector('#run-btn').onclick = () => {
            if (localStorage.getItem(STORAGE_RUNNING) === 'true') {
                localStorage.removeItem(STORAGE_RUNNING);
                localStorage.removeItem(STORAGE_INDEX);
                location.reload();
            } else {
                localStorage.setItem(STORAGE_RUNNING, 'true');
                localStorage.setItem(STORAGE_INDEX, select.value);
                location.reload();
            }
        };
        document.body.appendChild(container);
    }

    window.addEventListener('load', () => {
        setTimeout(createUI, 2000);
        checkAndResume();
    });
})();`;

    document.getElementById('scriptOutput').value = script;
}

function copy() { 
    document.getElementById('scriptOutput').select(); 
    document.execCommand('copy'); 
}
</script>
</body>
</html>

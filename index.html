<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Automation Studio | Professional Generator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root { --bg: #f8fafc; --primary: #2563eb; --panel: #ffffff; }
  body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding: 40px 15px; color: #1e293b; }
  .studio-card { max-width: 950px; margin: auto; background: var(--panel); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; overflow: hidden; }
  .studio-header { background: #f1f5f9; padding: 25px 30px; border-bottom: 1px solid #e2e8f0; }
  .studio-body { padding: 30px; }
  .terminal-box { background: #0f172a; color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; padding: 20px; border-radius: 8px; width: 100%; height: 450px; overflow-y: auto; border: 1px solid #334155; }
  .btn-generate { background: var(--primary); color: white; font-weight: 600; padding: 12px 24px; transition: 0.2s; }
  .btn-generate:hover { background: #1d4ed8; transform: translateY(-1px); }
</style>
</head>
<body>

<div class="studio-card">
  <div class="studio-header">
    <h3 class="m-0 fw-bold"><i class="bi bi-robot me-2"></i>ERP Auto Live Class Scheduler </h3>
    <small class="text-muted">Professional Userscript Generation Engine (v46)</small>
  </div>
  <div class="studio-body">
    <div class="mb-4">
      <label class="form-label fw-semibold">Paste Excel Schedule Stream</label>
      <textarea id="excelData" class="form-control shadow-sm" rows="6" placeholder="Paste your Excel rows here (Start Date, End Date, Time...)..."></textarea>
    </div>
    <button class="btn btn-generate w-100 shadow" onclick="generateFullScript()">
      <i class="bi bi-lightning-charge me-2"></i>Compile & Generate Script
    </button>
    <div class="mt-4">
      <textarea id="scriptOutput" class="terminal-box" readonly placeholder="Compilation ready for output..."></textarea>
      <button class="btn btn-outline-secondary w-100 mt-2" onclick="copy()"><i class="bi bi-clipboard me-2"></i>Copy Compiled Userscript</button>
    </div>
  </div>
</div>

<script>
function formatDate(dateStr) { const p = dateStr.split('-'); return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : dateStr; }
function parseTime(timeStr) {
    const m = timeStr.trim().match(/(\d+):(\d+)\s*(AM|PM)/i);
    return m ? { Hour: m[1].padStart(2, '0'), Min: m[2], AMPM: m[3].toUpperCase() } : { Hour: '12', Min: '00', AMPM: 'AM' };
}

function generateFullScript() {
    const raw = document.getElementById('excelData').value.trim();
    if(!raw) { alert("Please paste data first!"); return; }
    const rows = raw.split('\n').filter(r => r.trim() !== "");
    const dataRows = rows[0].includes('Start Date') ? rows.slice(1) : rows;
    
    const classData = dataRows.map(row => {
        const cols = row.split('\t');
        const start = parseTime(cols[2]);
        const end = parseTime(cols[3]);
        return { "Date": formatDate(cols[0]), "StartTime": start.Hour, "StartMin": start.Min, "StartAMPM": start.AMPM, "EndTime": end.Hour, "EndMin": end.Min, "EndAMPM": end.AMPM, "Class": cols[5], "Section": `${cols[5]}-${cols[6]}`, "Teacher": cols[7], "Subject": cols[8] };
    });

    const script = `// ==UserScript==
// @name         ERP Auto-Scheduler Final
// @match        *://*/*
// @grant        none
// ==/UserScript==

(function() {
    'use strict';
    const classData = ${JSON.stringify(classData, null, 4)};

    function log(message) {
        const logArea = document.getElementById('automation-log');
        if (!logArea) return;
        const entry = document.createElement('div');
        entry.textContent = \`[\${new Date().toLocaleTimeString()}] \${message}\`;
        logArea.appendChild(entry);
    }

    async function triggerEvents(element) {
        ['input', 'change', 'blur'].forEach(ev => element.dispatchEvent(new Event(ev, { bubbles: true })));
    }

    async function selectCustomDropdown(selector, itemText, isIndex = false, index = 0, exactMatch = false) {
        if (!itemText) return false;
        let dropdown = isIndex ? document.querySelectorAll('ng-multiselect-dropdown')[index] : document.querySelector(\`ng-multiselect-dropdown[name="\${selector}"]\`);
        if (!dropdown) return false;
        dropdown.querySelector('.dropdown-btn').click();
        await new Promise(r => setTimeout(r, 500));
        const listItems = dropdown.querySelectorAll('.item2 li');
        for (let li of listItems) {
            if ((exactMatch ? (li.textContent.trim().toUpperCase() === itemText.toUpperCase()) : (li.textContent.trim().toUpperCase().includes(itemText.toUpperCase())))) {
                li.querySelector('input').click();
                dropdown.querySelector('.dropdown-btn').click();
                await triggerEvents(dropdown);
                return true;
            }
        }
        return false;
    }

    async function runAutomation(entry, index) {
        const startDate = document.querySelector('input[name="startDate"]');
        if (startDate) { startDate.value = entry.Date; await triggerEvents(startDate); }
        const timeFields = {'slotTime': entry.StartTime, 'slotMin': entry.StartMin, 'slotType': entry.StartAMPM, 'slotEndTime': entry.EndTime, 'slotEndMin': entry.EndMin, 'slotEndType': entry.EndAMPM};
        for (const [name, val] of Object.entries(timeFields)) {
            let el = document.querySelector(\`select[name="\${name}"]\`);
            if (el) { el.value = val; await triggerEvents(el); }
        }
        await selectCustomDropdown("std1", entry.Class, false, 0, true);
        await selectCustomDropdown("section", entry.Section, false, 0, true);
        await selectCustomDropdown(null, entry.Teacher, true, 2, false);
        const subjectEl = document.querySelector('select[name="subject"]');
        if (subjectEl) { subjectEl.value = entry.Subject; await triggerEvents(subjectEl); }
        const saveBtn = document.querySelector('button.save-btn');
        if (saveBtn) saveBtn.click();
        await new Promise(r => setTimeout(r, 1000));
        const yesBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent.trim() === 'Yes');
        if (yesBtn) yesBtn.click();
    }

    function createUI() {
        if (document.getElementById('erp-scheduler-control')) return;
        const container = document.createElement('div');
        container.id = 'erp-scheduler-control';
        container.style = 'position:fixed; top:10px; right:10px; z-index:999999; background:white; border:2px solid #2563eb; padding:15px; width:320px; border-radius:12px; box-shadow:0 10px 15px rgba(0,0,0,0.1); font-family:sans-serif;';
        container.innerHTML = '<h6 class="mb-2">Scheduler Automation</h6><select id="start-index" class="form-select mb-2"></select><button id="run-btn" class="btn btn-primary w-100">RUN AUTOMATION</button><div id="automation-log" class="mt-2 bg-dark text-success p-2 small" style="height:100px; overflow-y:auto; font-family:monospace;"></div>';
        
        const select = container.querySelector('#start-index');
        classData.forEach((item, i) => { const opt = document.createElement('option'); opt.value = i; opt.text = \`[\${i}] \${item.Class} \${item.Section} - \${item.Teacher}\`; select.appendChild(opt); });
        container.querySelector('#run-btn').onclick = async () => {
            let start = parseInt(select.value);
            for (let i = start; i < classData.length; i++) { await runAutomation(classData[i], i); await new Promise(r => setTimeout(r, 3000)); }
        };
        document.body.appendChild(container);
    }
    window.addEventListener('load', () => setTimeout(createUI, 2000));
})();`;
    document.getElementById('scriptOutput').value = script;
}
function copy() { document.getElementById('scriptOutput').select(); document.execCommand('copy'); }
</script>
</body>
</html>
